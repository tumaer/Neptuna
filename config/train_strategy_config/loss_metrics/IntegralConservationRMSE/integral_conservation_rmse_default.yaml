use_boundary_fluxes: true
normalization: none

# Explicit component list with names matching loss outputs
# Domain components: domain/<quantity>
# Boundary components: boundary/<quantity>/<patch>
components:
  # Domain components
  - name: domain/mass
    weight: 1.0
  - name: domain/Px
    weight: 1.0
  - name: boundary/mass/west
    weight: 1.0
  - name: boundary/mass/east
    weight: 1.0
  - name: boundary/mass/north
    weight: 1.0
  - name: domain/center_of_gravity_y
    weight: 1.0
  - name: boundary/Py/east
    weight: 1.0

# For 3D:
#  - name: boundary/mass/top
#    weight: 1.0
