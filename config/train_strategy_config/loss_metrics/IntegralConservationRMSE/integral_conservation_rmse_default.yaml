use_boundary_fluxes: true
normalization: none

field_keys:
  density: Density
  velocity_x: Velocity_X
  velocity_y: Velocity_Y
  velocity_z: Velocity_Z
  pressure: Pressure
  energy: Energy
  vorticity: Vorticity

# Domain components: domain/<quantity>
# Boundary components: boundary/<quantity>/<patch>
components:
  # Domain components
  - name: domain/mass
    weight: 1.0
  - name: domain/Px
    weight: 1.0
  - name: boundary/mass/west
    weight: 1.0
  - name: boundary/mass/east
    weight: 1.0
  - name: boundary/mass/north
    weight: 1.0
  - name: domain/center_of_gravity_y
    weight: 1.0
  - name: boundary/Py/east
    weight: 1.0

