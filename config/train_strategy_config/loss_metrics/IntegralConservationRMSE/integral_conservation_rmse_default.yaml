use_boundary_fluxes: true
normalization: none

field_keys:
  density: density
  velocity_x: Velocity_X
  velocity_y: Velocity_Y
  velocity_z: Velocity_Z
  pressure: Pressure
  energy: Energy
  # Kept for backward compatibility; enstrophy now uses velocity gradients.
  vorticity: Vorticity

# Domain components: domain/<quantity>
# Boundary components: boundary/<quantity>/<patch>
components:
  # Domain components
  - name: domain/enstrophy
    weight: 1.0
