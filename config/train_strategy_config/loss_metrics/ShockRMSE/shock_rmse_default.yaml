gradient_threshold: [0.13, 5.0]  # [min, max] gradient magnitude in physical units
threshold_softness: 0.01  # Smoothness of transition (fraction of range width)
blur_sigma: 3.0  # Gaussian blur sigma (0 = disabled)
gradient_mode: diff  # 'sobel' or 'diff'
normalization: none  # 'none', 'magnitude', or 'variance'
epsilon: 1.0e-8

# Optional: per-channel thresholds
# per_channel_thresholds:
#   Density: [0.5, 5.0]
#   Pressure: [1.0, 10.0]