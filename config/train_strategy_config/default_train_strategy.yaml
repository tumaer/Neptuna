########################################################
# Training strategy configuration
########################################################
num_train_epochs: 1
batch_eval_metrics: True
metric_for_best_model:
  # - type: L2Loss
  #   weight: 1.0         
  - type: CompositeLoss
    weight: 1.0
    name: "SSIM_L2_Composite"
    sub_components:
      - type: SSIM
        weight: 0.7
      - type: L2Loss
        weight: 0.3

curriculum:
  - name: block_1
    start_epoch: 0
    train_loss:
      components:
        - type: CompositeLoss
          weight: 1.0
          name: "SSIM_L2_Composite_train"
          sub_components:
            - type: SSIM
              weight: 0.1
              metric_params: 
                window_size: 7
            - type: L2Loss
              weight: 0.9
              channel_weights: [0.34, 0.52, 0.78]
      train_loss_weighting_strategy:
        enabled: false  # Set to true to enable
        type: BalancedResidualDecayRate
        loss_source: 'train' # 'train' OR 'eval'
      
    validation_loss:
      components:
        - type: L1Loss
          weight: 1.0
        - type: CompositeLoss
          weight: 1.0
          name: "SSIM_L2_Composite"
          sub_components:
            - type: SSIM
              weight: 0.7
            - type: L2Loss
              weight: 0.3

