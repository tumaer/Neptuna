# Training strategy configuration
########################################################
num_train_epochs: 20
metric_for_best_model:
  - type: MSE
    weight: 1.0         
  # - type: CompositeLoss
  #   weight: 1.0
  #   name: "SSIM_L2_Composite"
  #   sub_components:
  #     - type: SSIM
  #       weight: 0.7
  #     - type: MSE
  #       weight: 0.3

curriculum:
  - name: block_1
    start_epoch: 0
    train_loss:
      components:
        - type: MSE
          weight: 1.0
      train_loss_weighting_strategy:
        enabled: true  # Set to true to enable
        type: GradNorm
        grad_stats_last_layer_only: true
        weight_sub_components: false
        weight_per_channel: false
        loss_history_interval: 10
        grad_history_interval: 10
    validation_loss:
      components:
        - type: MAE
          weight: 1.0

