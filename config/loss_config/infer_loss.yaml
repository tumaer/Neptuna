loss:
  components:
    # Same components as training but with weight=1.0 for unweighted comparison
    - type: L2Loss
      weight: 1.0  # Unweighted
      name: "l2_error"
      config_file: "L2_Loss/l2_loss_default"
    
    - type: SSIM
      weight: 1.0  # Unweighted
      name: "ssim"
      config_file: "SSIM/ssim_default"
    
    # Add additional metrics not used in training
    - type: PearsonCorrelationLoss
      weight: 1.0
      name: "pearson"
      config_file: "PearsonCorrelationLoss/pearson_correlation_loss_default"
    
    - type: L1Loss
      weight: 1.0
      name: "l1_error"
      config_file: "L1_Loss/l1_loss_default"