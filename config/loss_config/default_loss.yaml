loss:
  components:
    - type: L2Loss
      weight: 0.5
    - type: L1Loss
      weight: 1.0

loss_weighting_strategy:
  enabled: true  # Set to true to enable
  type: GaussianLikelihood
  loss_source: 'train' # 'train', 'eval' or 'both'
  log_detailed_losses: true # must be true to use training loss for weight updates

# Each component is a dictionary with the following fields:
# - type: Loss class name
# - weight: Base scalar weight (default: 1.0)
# - timestep_weights: List of per-timestep weights, length T (optional)
# - channel_weights: List of per-channel weights, length C (optional)

# Example: RMSE with per-channel weighting
# - type: RMSE
#   weight: 1.0
#   channel_weights: [1.0, 1.0, 0.5]

