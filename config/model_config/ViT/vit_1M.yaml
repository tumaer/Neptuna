model_name: ViT
latent_channels: 128 #768
num_hidden_layers: 2 # number of ViTLayers in the Encoder
num_attention_heads: 4
intermediate_size: 512
hidden_act: gelu
hidden_dropout_prob: 0.0
attention_probs_dropout_prob: 0.0
initializer_range: 0.02
patch_size: 8
qkv_bias: True
norm_layer_eps: 1e-5
norm: 'layer' # layer, batch, group