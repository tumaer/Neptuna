model_name: FNO
decoder_layers: 2
decoder_layer_size: 256
decoder_activation_fn_name: 'silu'
latent_channels: 32   #number of channels in the latent space after lifting.
n_fno_layers: 6
fno_modes: 45 #can also be a list of integers, e.g.[32, 64, 32] for 3D. 
#NOTE: The last dimension of the fno_modes should not exceed the ((grid_resolution[-1]+padding)//2) +1.
padding: 8
padding_type: 'constant' #constant,reflect, replicate or circular
activation_fn_name: 'gelu'
norm_layer_eps: 1e-5
norm: 'layer' # layer, batch, group (see model_utils.py for max_groups), identity