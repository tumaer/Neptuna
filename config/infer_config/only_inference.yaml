do_infer: True
debug: False  # Set true or use INFERENCE_DEBUG=1 to enable _dbg prints
metrics_device: mps # Device for rollout metric computation (e.g. cuda:0, xpu:0, mps, cpu). Null = auto (cuda:0/xpu:0/mps if available, else cpu)
batch_eval_metrics: True
inference_directory: null
dataset_directory_path: null # if null, will use the dataset_directory_path from data_config.json inside the experiment directory.
filter_features:
  infer_filter_frames: [null, null]
  infer_filter_groups: null
n_infer_rollouts: 8
n_infer_plot_examples: 6
infer_telemetry_sample_interval_sec: 1.0
plot_orientation: vertical # Plot orientation for inference plots. Options: vertical, horizontal
infer_from_random_timestep: False
infer_from_ic: True