optimize: true
n_trials: 5
metric_for_tuning_hp: ['eval_l2_error']
optuna_sampler: TPESampler
sampler_params:
  n_startup_trials: 2
  seed: 42
search_domain:
  per_device_train_batch_size:
      method: categorical
      choices: [4, 8, 16, 32]
    # method: categorical
    # choices: [8]

  learning_rate:
    method: float
    low: 1e-8
    high: 1e-1
    log: true
    # method: categorical
    # choices: [0.0416]

  weight_decay:
    method: float
    low: 1e-7
    high: 1e-3
    log: true
    # method: categorical
    # choices: [5.449e-6]
  
  lr_scheduler_type:
    method: categorical
    choices: ['linear', 'cosine',  'polynomial', 'constant']
    # method: categorical
    # choices: ['constant']

  warmup_ratio:
    method: float
    low: 0.0
    high: 0.1
    log: false
    step: 0.01
    # method: categorical
    # choices: [0.02]