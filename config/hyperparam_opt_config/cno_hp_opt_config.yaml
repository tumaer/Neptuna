optimize: true
n_trials: 200
metric_for_tuning_hp: ['eval_l2_error']
search_domain:
  train_config:
    max_steps:
      method: categorical
      choices: [25]

    pushforward:
      max_allowed_unroll_steps:
        method: categorical
        choices: [[0,0,0]]
    
  model_config:
    latent_channels:
      method: categorical
      choices: [16, 32, 64]
    cno_depth:
      method: categorical
      choices: [2, 3, 4]
    n_blocks:
      method: categorical
      choices: [4,5]
    n_blocks_bottleneck:
      method: categorical
      choices: [2, 4]
    channel_multiplier:
      method: categorical
      choices: [8, 16, 32]
    norm:
      method: categorical
      choices: [True, False]