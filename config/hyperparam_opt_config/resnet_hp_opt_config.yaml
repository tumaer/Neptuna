optimize: true
n_trials: 5
metric_for_tuning_hp: ['eval_l2_error']
optuna_sampler: TPESampler
sampler_params:
  n_startup_trials: 2
  seed: 42
search_domain:
  train_config:
    num_train_epochs:
      method: categorical
      choices: [0.05, 0.1]

    pushforward_config:
      enabled:
        method: categorical
        choices: [true, false]
      deciding_epochs:
        method: categorical
        choices:
          - [-1, 2, 50]
          - [-1, 5, 80]
      max_allowed_unroll_steps:
        method: categorical
        choices:
          - [0, 1, 2]
          - [0, 1, 3]
      relative_probabilities:
        method: categorical
        choices:
          - [7, 2, 1]
          - [6, 3, 1]

  model_config:
    latent_channels:
      method: categorical
      choices: [16, 32, 64]
    num_blocks:
      method: categorical
      choices: [[1, 1], [1, 1, 1], [1, 1, 1, 1]]
    n_groups:
      method: categorical
      choices: [1, 2, 4]
    activation_fn_name:
      method: categorical
      choices: ['gelu', 'relu']
