optimize: true
n_trials: 4
metric_for_tuning_hp: ['eval_l2_error']
optuna_sampler: Random_sampler
sampler_params:
  seed: 0  # for reproducible random sampling
search_domain:
  train_config:
    num_train_epochs:
      method: categorical
      choices: [0.05, 0.1]

    pushforward_config:
      max_allowed_unroll_steps:
        method: categorical
        choices: [[0,0,0]]

  model_config:
    latent_channels:
      method: categorical
      choices: [16, 32, 64]
    num_blocks:
      method: categorical
      choices: [[1, 1], [1, 1, 1], [1, 1, 1, 1]]
    n_groups:
      method: categorical
      choices: [1, 2, 4]
    activation_fn_name:
      method: categorical
      choices: ['gelu', 'relu']
