dataset_name:
# Type: str
# Name of the dataset in CamelCase

seed:
# Type: int
# Global random seed for reproducibility across models and data loaders

dataset_directory_path:
# Type: str 
# Dataset 'folder' path
# Paste the files named train.h5 (for train and validation) and test.h5 (for inference) inside this directory.

dimension: 
# Type: int
# Dimension of the dataset> options- 1/2/3

grid_resolution: null 
# Type: List[int, int, ...]
# Cartesian grid resolution
# Example: [256, 64] for 2D. 
# If not provided, will be inferred automatically from the dataset

eval_groups: null 
# Type: List[str, str, ...]
# To be provided, if user wants to choose specific groups from train.h5 for validation.
# eval_groups should be a subset of "filter_groups".
# Example:["seed 000000", "seed 000049"]. 
# The group names can be discovered by running the script: misc/dataset_structure_viz.py
# if eval_groups is null, validation groups are randomly chosen from train.h5 in accordance to 'eval_split_ratio' provided in train_config.

is_steady_state_prediction: False
# Type: bool 
# Set to True, if its a stedy-state dataset.

sequence_info: 
# Type: List[int, int, int]
# [input_seq_len, label_seq_len, stride]  
# Selects the number of historic input frames, the required number of bundled target frames 
# and the stride (timestep difference) between them

filter_features:
  train_filter_frames: [null, null]
  # Type: List[int, int] 
  # Filters the frames for train/validation from the dataset file
  # [min_frame, max_frame]
  # indexing of frames starts from 0.

  infer_filter_frames: [null, null]
  # Type: List[int, int] 
  # Filters the frames for inference from the dataset file
  # [min_frame, max_frame]
  # indexing of frames starts from 0.

  train_filter_groups: null 
  # Type: List[str, str, ...]
  # filters the groups for train/validation from the dataset file
  # Example: ["seed 000000", "seed 000049"]
  # The group names can be discovered by running the script: misc/dataset_structure_viz.py

  infer_filter_groups: null 
  # Type: List[str, str, ...]
  # filters the groups for inference from the dataset file
  # Example: ["seed 000000", "seed 000049"]
  # The group names can be discovered by running the script: misc/dataset_structure_viz.py

  filter_in_channels: null
  # Type: List[str, str, ...]
  # filters the input channels to be used for train/validation/inference 

  filter_out_channels: null
  # Type: List[str, str, ...]
  # filters the output channels to be used for train/validation/inference 

conditioning_features:
  conditioning_in_channels: null
  # Type: List[str, str, ...]
  # Choose the channels for conditioning from the input channels.
  # For transient simulations: filter_out_channels + conditioning_in_channels = filter_in_channels 
  # For steady-state simulations, the above relationship doesnt need to hold.

  conditioning_method: None
  # Type: str
  # infers the conditioning parameters from the group names and determines the conditioning method.
  # Options: None, AdaNorm_LSE, AdaNorm_SE_per_param, AdaNorm_1SE, AdaNorm
  # If it is None, no conditioning is applied
  # Example: If the group name is "001_Re100_Ma0.1", extracted parameters are [100, 0.1]
  # (a leading numeric id token like "001_" is ignored)

  conditioning_parameter_names: null
  # Type: List[str, str, ...] or null
  # Optional: choose which conditioning parameters to extract from group names.
  # Matching is case-insensitive and exact (no prefix fallback).
  # Example: ["Mas", "ugas", "We"]
  # null means: use all parsed conditioning parameters.

  parameter_min_max_stats: null
  # Type: Dict
  # min and max values of each parameter.
  # if not provided, it will be computed automatically from the dataset.
  # num_cond_params is auto-inferred from:
  # 1) len(conditioning_parameter_names) if provided, else
  # 2) len(parameter_min_max_stats)
  # Example, if there are 2 parameters say Re(0) and Ma(1):
  # 0:
  #   min: 100.0
  #   max: 1000.0
  # 1:
  #   min: 0.01
  #   max: 0.10

  conditioning_mlp:
    mlp: False
    # Type: bool
    # whether to use an MLP to process the embedded conditioning parameters before using the embedded parameters as affine transform parameters in AdaNorm.
    # If False, a Linear Layer is used instead of the MLP.

    hidden_size: null
    # Type: int
    # hidden size of the conditioning MLP. Only relevant if mlp is True.
    # if not provided, will be set to 4 * (inferred number of conditioning parameters)

    activation: gelu
    # Type: str
    # activation function for the conditioning MLP. Only relevant if mlp is True.
    # Options: relu, gelu, tanh, leaky_relu

residual_config: null
  add_base_value_with_raw_loss:
  #Type: bool 
  add_predicted_value_with_diff_loss: 
  #Type: bool
  add_predicted_value_with_raw_loss: 
  #Type: bool
# If using this option, only one of the aboe option should be True.
# Default is null.

data_normalization_strategy: 
# Type: str
# z_normalization, min_max_normalization, robust_normalization, no_normalization

data_normalization_stats: null 
# Type: Dict
# if not provided, will be computed automatically from the dataset
# Example:
    # density:
    #   mean: 0.9992666901623488
    #   std: 0.0017173667020404337
    #   min: 0.9860899448394775
    #   max: 1.0059986114501953
    #   median: 0.9998869299888611
    #   iqr: 0.0011609792709350586
    # velocity_0:
    #   mean: 0.021363726950354156
    #   std: 0.011059971516810064
    #   min: -0.02212641015648842
    #   max: 0.05820665508508682
    #   median: 0.02194954827427864
    #   iqr: 0.02132151066325605
    # velocity_1:
    #   mean: 2.4534008565977044e-06
    #   std: 0.007489236515888121
    #   min: -0.046874720603227615
    #   max: 0.04686852544546127
    #   median: 1.1994336546194972e-07
    #   iqr: 0.002700483484659344

coord_features: True 
# Type: bool
# specifies whether coordinate features should be added