#train_config
batch_size: 1
num_epochs: 128
eval_split_ratio: 0.2 #20% dataset used for evaluation
n_eval_rollouts: 4
# Parameters related to the push-forward trick during training
pushforward:
  # At which training step to introduce next unroll stage
  deciding_epochs: [-1, 2, 50]
  # For how many steps to unroll
  max_allowed_unroll_steps: [3, 3, 3]
  # Which probability ratio to keep between the unrolls
  relative_probabilities: [7, 2, 1]